services:
  - type: web
    name: addo-backend
    env: node
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: addo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://addo-frontend.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: web
    name: addo-frontend
    env: node
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://addo-backend.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: addo-db
    databaseName: appgen
    user: postgres
    plan: free
